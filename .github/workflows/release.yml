name: Release

# 发布流程：把 CHANGELOG.md 的“未发布”改为“X.Y.Z - 日期”，在 docs/compatibility.md 中把“未发布”一节复制为“X.Y.Z”，修改 pyproject.toml 中的版本并推送到 main；等 Tests 通过后推送 vX.Y.Z tag，再在 Actions 中批准 pypi environment。
# 使用 Trusted Publishing，不保存 API token；需先在 PyPI 登记本仓库、本文件名和 pypi environment。

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install build
      # tag 必须与包内版本一致，否则 PyPI 上的版本号会与 tag 不符。
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if os.environ['TAG'] != f'v{version}':
              sys.exit(f"tag {os.environ['TAG']} does not match project version {version}")
          EOF
      # 纯 Python wheel：原生桥接以源码随包分发，首次使用时在用户机器上编译。
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tpuasm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
