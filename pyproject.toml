[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tpuasm"
version = "0.1.0"
description = "Assemble and disassemble TPU machine bundles with physical issue slots"
readme = "README.md"
authors = [{name = "Ayaka Mikazuki"}]
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["tpu", "assembler", "disassembler", "jax", "pallas", "libtpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/ayaka14732/tpuasm"
Documentation = "https://ayaka14732.github.io/tpuasm/"
Source = "https://github.com/ayaka14732/tpuasm"
Issues = "https://github.com/ayaka14732/tpuasm/issues"
Changelog = "https://ayaka14732.github.io/tpuasm/changelog.html"

[project.scripts]
tpuasm = "tpuasm.printer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpuasm = ["native.cc", "native_backends/*.cc", "tc_source_native.cc", "source_backends/*.cc"]
